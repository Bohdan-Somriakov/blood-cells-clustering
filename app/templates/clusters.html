<!DOCTYPE html>
<html>
<head>
<title>Clusters View</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: linear-gradient(120deg, #0f172a, #111827);
    color: white;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 50px;
}

.box {
    background: rgba(255,255,255,0.05);
    padding: 25px;
    border-radius: 18px;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.1);
}

img {
    width: 100%;
    margin-top: 20px;
    border-radius: 14px;
    transition: 0.3s;
}

img:hover {
    transform: scale(1.01);
}

h1 {
    font-size: 32px;
}

p {
    color: #94a3b8;
}

a {
    display: inline-block;
    margin-top: 20px;
    padding: 10px 16px;
    background: #6366f1;
    color: white;
    border-radius: 10px;
    text-decoration: none;
}
</style>
</head>

<body>

<div class="container">

<div class="box">

<h1>Image Clusters</h1>

<p>
PCA-reduced visualization of CNN feature space clustered using KMeans.
</p>

<img src="{{ image }}">

<br>

<a href="/">← Back</a>

</div>

</div>

</body>
</html>
