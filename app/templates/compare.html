<!DOCTYPE html>
<html>
<head>
<title>Cluster Comparison</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: radial-gradient(circle, #111827, #0f172a);
    color: white;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 60px 20px;
}

.card {
    background: rgba(255,255,255,0.05);
    padding: 30px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.1);
    backdrop-filter: blur(12px);
    animation: fade 0.8s ease;
}

@keyframes fade {
    from {opacity:0; transform: translateY(20px);}
    to {opacity:1; transform: translateY(0);}
}

h1 {
    font-size: 34px;
}

p {
    color: #cbd5e1;
    line-height: 1.6;
}

img {
    width: 100%;
    margin-top: 25px;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    transition: 0.3s;
}

img:hover {
    transform: scale(1.02);
}

.btn {
    display: inline-block;
    margin-top: 25px;
    padding: 12px 18px;
    background: linear-gradient(90deg, #06b6d4, #3b82f6);
    color: white;
    text-decoration: none;
    border-radius: 12px;
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>Cluster Comparison</h1>

<p>
Comparison between real labels and KMeans clustering results after MobileNetV2 feature extraction and PCA reduction.
</p>

<img src="{{ image }}">

<a class="btn" href="/">← Return Home</a>

</div>

</div>

</body>
</html>
